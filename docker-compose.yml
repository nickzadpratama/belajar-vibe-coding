services:
  postgres:
    # postgres:17 dipakai karena path datanya klasik (/var/lib/postgresql/data).
    # Mulai image postgres:18, PGDATA berubah ke /var/lib/postgresql/18/docker —
    # jika upgrade ke 18+, ganti target volume menjadi /var/lib/postgresql.
    image: postgres:17
    container_name: belajar-vibe-coding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
